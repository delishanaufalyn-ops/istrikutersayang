<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday Istriku Tersayang</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }
  .app {
    position: relative;
    height: 100vh;
    width: min(100vw, calc(100vh * 9 / 16));
    aspect-ratio: 9 / 16;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(0,0,0,.35);
  }
  .page {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.015);
    transition: opacity .35s ease, transform .35s ease;
  }
  .page.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }
  .page img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
  .hotspot {
    position: absolute;
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
  }
  .hotspot:focus-visible {
    outline: 3px solid rgba(30, 100, 255, .8);
    outline-offset: 4px;
  }
  /* Coordinates are based on the supplied 1080x1920 screenshots. */
  .p1-next { left: 34%; top: 66.0%; width: 32%; height: 6.0%; }
  .p2-next { left: 34%; top: 65.0%; width: 32%; height: 6.0%; }
  .p3-gift { left: 3%; top: 30.0%; width: 27%; height: 13%; }
  .p3-letter { left: 35%; top: 30.0%; width: 29%; height: 13%; }
  .p3-photo { left: 63%; top: 30.0%; width: 34%; height: 13%; }
  .back { left: 34%; top: 89.8%; width: 32%; height: 5.0%; }
  .home-back { left: 1%; top: 1%; width: 12%; height: 7%; } /* optional invisible escape */
  @media (min-width: 900px) {
    .app { border-radius: 10px; }
  }
  @media (max-width: 600px) {
    .app { width: 100vw; height: 100vh; }
  }
</style>
</head>
<body>
<main class="app" aria-label="Kartu ulang tahun interaktif">
  <section class="page active" id="page1">
    <img src="assets/1.jpg" alt="Halaman pembuka">
    <button class="hotspot p1-next" data-go="2" aria-label="Tiup"></button>
  </section>

  <section class="page" id="page2">
    <img src="assets/2.jpg" alt="Ucapan ulang tahun">
    <button class="hotspot p2-next" data-go="3" aria-label="Lanjut"></button>
  </section>

  <section class="page" id="page3">
    <img src="assets/3.jpg" alt="Pilih hadiah, surat, atau foto">
    <button class="hotspot p3-gift" data-go="4" aria-label="Kado"></button>
    <button class="hotspot p3-letter" data-go="5" aria-label="Surat"></button>
    <button class="hotspot p3-photo" data-go="6" aria-label="Foto"></button>
  </section>

  <section class="page" id="page4">
    <img src="assets/4.jpg" alt="Hadiah">
    <button class="hotspot back" data-go="3" aria-label="Kembali"></button>
  </section>

  <section class="page" id="page5">
    <img src="assets/5.jpg" alt="Surat cinta">
    <button class="hotspot back" data-go="3" aria-label="Kembali"></button>
  </section>

  <section class="page" id="page6">
    <img src="assets/6.jpg" alt="Kumpulan foto">
    <button class="hotspot back" data-go="3" aria-label="Kembali"></button>
  </section>
</main>

<script>
  const pages = [...document.querySelectorAll('.page')];

  function showPage(n, push = true) {
    const id = Number(n);
    pages.forEach(p => p.classList.toggle('active', p.id === 'page' + id));
    if (push) history.pushState({page: id}, '', '#p' + id);
    window.scrollTo(0, 0);
  }

  document.querySelectorAll('[data-go]').forEach(btn => {
    btn.addEventListener('click', () => showPage(btn.dataset.go));
  });

  window.addEventListener('popstate', e => {
    const n = e.state?.page || Number((location.hash || '#p1').slice(2)) || 1;
    showPage(n, false);
  });

  const initial = Number((location.hash || '#p1').slice(2));
  if (initial >= 1 && initial <= 6) showPage(initial, false);
</script>
</body>
</html>
